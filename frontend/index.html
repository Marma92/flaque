<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <title>Flaque Hifi Player</title>

    <!-- ✅ Early theme application (no FOUC) -->
    <script>
      (function () {
        var key = "flaque_theme_v1";
        var storedTheme = window.localStorage.getItem(key);
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

        var theme =
          storedTheme === "dark" || storedTheme === "light"
            ? storedTheme
            : prefersDark
            ? "dark"
            : "light";

        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>

  <body>
    <!-- UI shell (safe before React mounts) -->
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle theme"
      title="Toggle theme"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z" />
      </svg>
    </button>

    <div id="root"></div>

    <!-- Optional: theme toggle logic (non-blocking) -->
    <script>
      (function () {
        var key = "flaque_theme_v1";
        var toggleButton = document.getElementById("theme-toggle");

        function getTheme() {
          return document.documentElement.getAttribute("data-theme") === "dark"
            ? "dark"
            : "light";
        }

        function applyTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        }

        if (toggleButton) {
          toggleButton.addEventListener("click", function () {
            var next = getTheme() === "dark" ? "light" : "dark";
            localStorage.setItem(key, next);
            applyTheme(next);
          });
        }
      })();
    </script>

    <!-- ✅ CRITICAL: Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
