services:
  backend:
    image: que20/flaque-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flaque-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATA_ROOT: /app/data
      # The backend always sits behind the nginx frontend, which sets
      # X-Forwarded-For — trust exactly that one hop for real client IPs.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "${FLAQUE_BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    volumes:
      - type: bind
        source: ${FLAQUE_STORAGE_DIR}
        target: /app/data/storage
      - type: bind
        source: ${FLAQUE_STATE_DIR}/config
        target: /app/data/config
      - type: bind
        source: ${FLAQUE_STATE_DIR}/index
        target: /app/data/index
      - type: bind
        source: ${FLAQUE_STATE_DIR}/cache
        target: /app/data/cache
      - type: bind
        source: ${FLAQUE_STATE_DIR}/logs
        target: /app/data/logs
      - type: bind
        source: ${FLAQUE_STATE_DIR}/backups
        target: /app/data/backups

  frontend:
    image: que20/flaque-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: flaque-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      BACKEND_PORT: ${BACKEND_PORT:-4000}
    ports:
      - "${FLAQUE_FRONTEND_PORT:-8080}:80"

  updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    container_name: flaque-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/repo
      - type: bind
        source: ${FLAQUE_STATE_DIR}/logs
        target: /app/data/logs
    environment:
      UPDATE_SECRET: ${UPDATE_SECRET:-}
      REPO_DIR: /app/repo
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-}
